basePath: /
definitions:
  dto.AuthResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/dto.User'
    type: object
  dto.ErrResponse:
    properties:
      error:
        type: string
      module:
        type: string
      type:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  dto.User:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Realtime chat application
  title: Recho
  version: 0.0.0
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrResponse'
      summary: Login to account
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Clear authentication cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      security:
      - CookieAuth: []
      summary: Logout user
      tags:
      - auth
  /api/auth/refresh:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrResponse'
      security:
      - CookieAuth: []
      summary: Refrsh tokens
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrResponse'
      summary: Register a new account
      tags:
      - auth
  /api/auth/verify:
    get:
      description: Check if user is authenticated
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrResponse'
      security:
      - CookieAuth: []
      summary: Verify authentication
      tags:
      - auth
securityDefinitions:
  CookieAuth:
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
